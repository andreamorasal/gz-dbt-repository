version: 2

sources:
   - name: raw #Renaming as an alias
     schema: gz_raw_data #Path of the table in BQ
     description: greenwez raw data source #optionnal 
     tables:

         - name: sales #Renaming as an alias
           identifier: raw_gz_sales #What is the exact name of the table in  BQ
           description: sales of greewneez / we have one row per product_id found in each order_id
           columns:
             - name: date_date
               description: date of purchase
               tests:
                 - not_null

             - name: "(orders_id || '-' || pdt_id)"
               description: primary key of the table
               tests:
                 - unique
                 - not_null

             - name: pdt_id
               description: id of the product
               tests:
                 - not_null

             - name: revenue
               description: product revenue
               tests:
                 - not_null  

             - name: quantity
               description: purchase quantity
               tests:
                 - not_null     

         - name: product
           identifier: raw_gz_product
           description: purchase_price by products_id
           columns:
             - name: products_id
               description: primary key of the table
               tests:
                 - unique
                 - not_null

             - name: purchse_price
               description: price of the purchase
               tests:
                 - not_null

         - name: ship
           identifier: raw_gz_ship
           description: ship_cost by orders_id
           columns:
             - name: orders_id
               description: primary key of the table
               tests:
                 - unique
                 - not_null

             - name: shipping_fee
               description: shipping fee of the order
               tests:
                 - not_null

             - name: logCost
               description: logistic costs of the order
               tests:
                 - not_null

             - name: ship_cost
               description: ship cost of the order
               tests:
                 - not_null           

models:
- name: int_sales_margin
     description: margin calculation per order
     columns:
       - name: orders_id
         description: orders key
         tests:
           - not_null
       - name: products_id
         description: products key
         tests:
           - not_null
       - name: margin
         description: Margin = Revenue - Purchase_cost
         tests:
           - not_null
       - name: Purchase_cost
         description: Purchase_cost = Quantity * Purchase_price
         tests:
           - not_null
       - name: date_date
         description: date of the order
         tests:
           - not_null
       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: quantity
         description: sum of quantity per order
         tests:
           - not_null
     tests:
       - unique:
           column_name: "(orders_id || '-' || products_id)"